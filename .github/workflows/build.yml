name: build

# 태그를 푸시하거나(Actions 탭에서) 수동 실행하면
# 윈도우 설치본(.exe)과 맥 설치본(.dmg)을 만들어 아티팩트로 올린다.
# 내 PC 에 윈도우/맥이 없어도 GitHub 의 빌드 머신이 대신 만들어 준다.

on:
  workflow_dispatch: # Actions 탭 → build → Run workflow 로 수동 실행
  push:
    tags: ['v*'] # 예: git tag v0.1.0 && git push origin v0.1.0

permissions:
  contents: write # 릴리스 업로드에 필요

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            script: dist:win
            updateTarget: nsis
            installTarget: portable
            artifact: windows-installer
          - os: macos-latest
            platform: mac
            script: dist:mac
            updateTarget: zip
            installTarget: dmg
            artifact: macos-dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 태그(v*)를 밀면 GitHub Releases 에 올려서 앱의 "정보 > 업데이트" 가 받아갈 수 있게 한다.
      # 업데이트에 꼭 필요한 것(윈도우 nsis, 맥 zip)을 먼저 올리고,
      # 첫 설치용(맥 dmg)은 실패해도 릴리스 자체는 남도록 따로 돌린다.
      - name: build (release, 업데이트용)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run build:info && npx electron-builder --${{ matrix.platform }} ${{ matrix.updateTarget }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: build (release, 설치용)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.installTarget }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: build (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run ${{ matrix.script }}
        env:
          # 서명 인증서가 없는 CI 에서 키체인 인증서를 찾다가 실패하는 것을 막는다
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 일부 타깃이 실패해도 그때까지 만들어진 산출물은 받을 수 있게 always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: warn
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
