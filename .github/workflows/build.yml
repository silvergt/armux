name: build

# 태그를 푸시하거나(Actions 탭에서) 수동 실행하면
# 윈도우 설치본(.exe)과 맥 설치본(.dmg)을 만들어 아티팩트로 올린다.
# 내 PC 에 윈도우/맥이 없어도 GitHub 의 빌드 머신이 대신 만들어 준다.

on:
  workflow_dispatch: # Actions 탭 → build → Run workflow 로 수동 실행
  push:
    tags: ['v*'] # 예: git tag v0.1.0 && git push origin v0.1.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: windows-installer
          - os: macos-latest
            script: dist:mac
            artifact: macos-dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run ${{ matrix.script }}
        env:
          # 서명 인증서가 없는 CI 에서 키체인 인증서를 찾다가 실패하는 것을 막는다
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 일부 타깃이 실패해도 그때까지 만들어진 산출물은 받을 수 있게 always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: warn
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
