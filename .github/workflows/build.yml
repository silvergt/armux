name: build

# 태그를 푸시하거나(Actions 탭에서) 수동 실행하면
# 윈도우 설치본(.exe)과 맥 설치본(.dmg)을 만들어 아티팩트로 올린다.
# 내 PC 에 윈도우/맥이 없어도 GitHub 의 빌드 머신이 대신 만들어 준다.

on:
  workflow_dispatch: # Actions 탭 → build → Run workflow 로 수동 실행
  push:
    tags: ['v*'] # 예: git tag v0.1.0 && git push origin v0.1.0

permissions:
  contents: write # 릴리스 업로드에 필요

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            script: dist:win
            updateTarget: nsis
            installTarget: portable
            artifact: windows-installer
          - os: macos-latest
            platform: mac
            script: dist:mac
            updateTarget: zip
            installTarget: dmg
            artifact: macos-dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # publish 는 아래 gh 단계에서 직접 한다 (여기서 하면 토큰이 없어 실패)
      - name: build
        run: npm run build:info && npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # 서명 인증서가 없는 CI 에서 키체인 인증서를 찾다가 실패하는 것을 막는다
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 태그(v*)를 밀면 릴리스에 직접 올린다.
      # (electron-builder 의 자체 업로더는 큰 파일에서 종종 조용히 빠뜨려서 gh 로 올린다)
      - name: upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" -t "$TAG" -n "Armux Terminal $TAG" || true
          shopt -s nullglob
          rm -f dist/builder-debug.yml
          files=(dist/*.exe dist/*.dmg dist/*.zip dist/*.yml dist/*.blockmap)
          echo "올릴 파일: ${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"'

      # 일부 타깃이 실패해도 그때까지 만들어진 산출물은 받을 수 있게 always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: warn
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
