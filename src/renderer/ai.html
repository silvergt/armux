<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>AI 질문</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    background: #101318; color: #d5dbe3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    font-size: 13px;
  }
  /* 머리: 대상 서버 + 컨텍스트 + 고정/새 대화 */
  #head {
    flex: none; display: flex; align-items: center; gap: 8px;
    height: 34px; padding: 0 10px;
    background: #151a21; border-bottom: 1px solid #2a2e37;
    -webkit-app-region: drag; /* 빈 곳을 끌면 창 이동 */
  }
  #title { font-weight: 600; color: #cdd6e0; white-space: nowrap; }
  #ctx { flex: 1; color: #5f8fbf; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { -webkit-app-region: no-drag; }
  .hbtn {
    flex: none; height: 24px; padding: 0 9px;
    border: 1px solid #2a2e37; border-radius: 5px;
    background: transparent; color: #9aa3ae; font-size: 11.5px;
  }
  .hbtn:hover { background: #262b33; color: #fff; }
  .hbtn.on { color: #f4c430; border-color: #6b5a1e; }

  #log {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 12px; display: flex; flex-direction: column; gap: 8px;
    user-select: text;
  }
  .msg {
    max-width: 92%; padding: 7px 10px; border-radius: 8px;
    font-size: 12.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .m-user { align-self: flex-end; background: #24486f; color: #e8f0fa; }
  .m-ai { align-self: flex-start; background: #1a1f27; color: #d5dbe3; border: 1px solid #262c36; }
  .m-err { align-self: flex-start; background: #3a2226; color: #ffb0b0; border: 1px solid #5c3138; }
  .m-wait { align-self: flex-start; color: #7f8792; animation: pulse 1.2s infinite ease-in-out; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  /* 새 컨텍스트로 대화가 갈릴 때의 구분선 */
  .divider {
    display: flex; align-items: center; gap: 8px;
    color: #5b6673; font-size: 11px; margin: 6px 0;
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #262c36; }
  /* 사고 과정(접이식) */
  details.think {
    align-self: stretch; max-width: 100%;
    border: 1px solid #262c36; border-radius: 8px; background: #14171d;
  }
  details.think summary {
    padding: 5px 10px; color: #7b8594; font-size: 11.5px; cursor: pointer; user-select: none;
  }
  details.think[open] summary { border-bottom: 1px solid #21262e; }
  .think-body {
    padding: 8px 10px; color: #8b94a3; font-size: 11.5px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow-y: auto;
    font-style: italic;
  }
  .think-step { font-style: normal; color: #6f9fd8; margin: 2px 0; }

  #row {
    flex: none; display: flex; gap: 6px; padding: 9px 10px;
    border-top: 1px solid #2a2e37; background: #12161c;
  }
  #input {
    flex: 1; min-width: 0; resize: none; outline: none;
    border: 1px solid #2a2e37; border-radius: 6px; padding: 7px 9px;
    background: #0d0f13; color: #e2e7ee; font: inherit; line-height: 1.5;
    max-height: 120px;
  }
  #input:focus { border-color: #4da3ff; }
  #send {
    flex: none; padding: 0 14px; border: 1px solid #2d5f96; border-radius: 6px;
    background: #1d3a5c; color: #dbe9f8; font-size: 12px;
  }
  #send:hover { background: #24486f; }
  #send:disabled { opacity: .5; }
</style>
</head>
<body>
  <div id="head">
    <span id="title">✳ AI 질문</span>
    <span id="ctx"></span>
    <button id="pin" class="hbtn" title="항상 위에 고정">📌 고정</button>
    <button id="newchat" class="hbtn" title="대화를 새로 시작 (기록은 남습니다)">새 대화</button>
  </div>
  <div id="log"></div>
  <div id="row">
    <textarea id="input" rows="1" spellcheck="false"
      placeholder="화면 내용에 대해 물어보세요 (Enter 전송 · Shift+Enter 줄바꿈)"></textarea>
    <button id="send">전송</button>
  </div>
  <script src="./ai.js"></script>
</body>
</html>
